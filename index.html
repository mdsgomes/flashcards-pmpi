<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revisão PMPI 2026 - Flashcards Reta Final</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .perspective { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
      <div>
        <h1 class="text-xl font-bold text-emerald-400">PMPI 2026 • Flashcards Reta Final</h1>
        <p class="text-xs text-slate-400">Revisão Rápida • Prova em 06/12</p>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="toggleMode('all')" id="btn-mode-all" class="px-3 py-1 text-xs rounded bg-emerald-600 text-white font-semibold">Todos os Cards</button>
        <button onclick="toggleMode('errors')" id="btn-mode-errors" class="px-3 py-1 text-xs rounded bg-slate-700 text-slate-300 font-semibold hover:bg-rose-600 hover:text-white">Revisar Erros (<span id="error-count-badge">0</span>)</button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto w-full p-4 flex-1 flex flex-col gap-6">

    <!-- Progresso Geral -->
    <section class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-lg">
      <div class="flex justify-between text-sm mb-2 font-medium">
        <span>Progresso de Estudo</span>
        <span id="progress-text">0 / 0 (0%)</span>
      </div>
      <div class="w-full bg-slate-700 h-3 rounded-full overflow-hidden">
        <div id="progress-bar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
      </div>
      <div class="flex justify-between items-center mt-3 text-xs text-slate-400">
        <span class="text-emerald-400 font-bold">Acertos: <span id="stat-correct">0</span></span>
        <span class="text-rose-400 font-bold">Erros: <span id="stat-wrong">0</span></span>
        <button onclick="resetStats()" class="underline hover:text-slate-200">Zerar Estatísticas</button>
      </div>
    </section>

    <!-- Filtro de Matéria -->
    <div class="flex flex-col sm:flex-row gap-3">
      <select id="subject-filter" onchange="filterCards()" class="bg-slate-800 border border-slate-700 text-slate-200 rounded-lg p-2.5 text-sm w-full">
        <option value="ALL">Todas as Matérias</option>
        <option value="Legislação PMPI">Legislação da PMPI</option>
        <option value="Noções de Direito">Noções de Direito</option>
      </select>
    </div>

    <!-- Área do Flashcard -->
    <div class="relative w-full h-80 perspective cursor-pointer" onclick="flipCard()">
      <div id="card-inner" class="w-full h-full transform-style-3d transition-transform duration-500 relative rounded-2xl shadow-2xl">
        
        <!-- Frente -->
        <div class="absolute inset-0 bg-slate-800 border-2 border-slate-700 rounded-2xl p-6 flex flex-col justify-between backface-hidden">
          <div class="flex justify-between items-center text-xs text-emerald-400 font-bold uppercase tracking-wider">
            <span id="card-subject">Matéria</span>
            <span id="card-topic">Tópico</span>
          </div>
          <div class="text-center my-auto">
            <p id="card-question" class="text-lg sm:text-xl font-medium text-slate-100 leading-relaxed">Carregando flashcards...</p>
          </div>
          <div class="text-center text-xs text-slate-500 italic">Clique para virar e ver a resposta</div>
        </div>

        <!-- Verso -->
        <div class="absolute inset-0 bg-slate-800 border-2 border-emerald-500/50 rounded-2xl p-6 flex flex-col justify-between backface-hidden rotate-y-180">
          <div class="flex justify-between items-center text-xs font-bold uppercase tracking-wider">
            <span id="card-gabarito" class="px-2 py-0.5 rounded text-white bg-emerald-600">GABARITO</span>
            <span class="text-slate-400">Fundamentação</span>
          </div>
          <div class="my-auto overflow-y-auto max-h-48 pr-2">
            <p id="card-answer" class="text-sm sm:text-base text-slate-200 leading-relaxed"></p>
          </div>
          <div class="text-center text-xs text-slate-500">Avalie sua resposta abaixo</div>
        </div>

      </div>
    </div>

    <!-- Botões de Ação (Certo / Errado) -->
    <div class="grid grid-cols-2 gap-4">
      <button onclick="markCard(false)" class="py-4 bg-rose-600/20 hover:bg-rose-600 border border-rose-500 text-rose-200 hover:text-white font-bold rounded-xl transition-all shadow-lg active:scale-95 flex items-center justify-center gap-2">
        <span>✕</span> Errei / Revisar
      </button>
      <button onclick="markCard(true)" class="py-4 bg-emerald-600/20 hover:bg-emerald-600 border border-emerald-500 text-emerald-200 hover:text-white font-bold rounded-xl transition-all shadow-lg active:scale-95 flex items-center justify-center gap-2">
        <span>✓</span> Acertei
      </button>
    </div>

    <!-- Gráfico de Desempenho por Matéria -->
    <section class="bg-slate-800 rounded-xl p-4 border border-slate-700 mt-4">
      <h3 class="text-sm font-bold text-slate-300 mb-4">Percentual de Acertos por Matéria</h3>
      <div class="h-48 w-full">
        <canvas id="performanceChart"></canvas>
      </div>
    </section>

  </main>

  <script>
    // BANCO DE DADOS DE EXEMPLO (EXPANDÍVEL ATÉ 1.000 CARDS)
    const rawCards = [
      {
        id: 1,
        subject: "Legislação PMPI",
        topic: "Constituição Estadual - Segurança Pública",
        question: "A Segurança Pública no Estado do Piauí é exercida para a preservação da ordem pública, incolumidade das pessoas e patrimônio, sendo composta taxativamente por Polícia Civil, Polícia Militar, Corpo de Bombeiros Militar e Polícia Penal.",
        answer: "CERTO. Art. 156 da CE-PI. A segurança pública é exercida pelos órgãos listados, incluindo a Polícia Penal inserida pela EC nº 56/2020.",
        correctAnswer: true
      },
      {
        id: 2,
        subject: "Noções de Direito",
        topic: "Direito Penal - Peculato",
        question: "O crime de peculato exige obrigatoriamente que o bem apropriado ou desviado pelo funcionário público seja de propriedade pública.",
        answer: "ERRADO. Art. 312 do Código Penal. O bem pode ser público OU particular, desde que o funcionário público tenha a posse em razão do cargo.",
        correctAnswer: false
      },
      {
        id: 3,
        subject: "Noções de Direito",
        topic: "Direito Constitucional - Segurança Pública",
        question: "Segundo a CF/88, as Polícias Militares e os Corpos de Bombeiros Militares são forças auxiliares e reserva do Exército.",
        answer: "CERTO. Art. 144, § 6º da CF/88. Subordinam-se aos Governadores dos Estados, do DF e dos Territórios.",
        correctAnswer: true
      },
      {
        id: 4,
        subject: "Noções de Direito",
        topic: "Legislação Especial - Lei Maria da Penha",
        question: "A Lei Maria da Penha (Lei nº 11.340/2006) possui natureza jurídica exclusivamente processual penal.",
        answer: "ERRADO. Possui natureza jurídica HÍBRIDA (ou mista), pois traz normas materiais, processuais e de assistência social.",
        correctAnswer: false
      }
    ];

    let currentCards = [...rawCards];
    let currentIndex = 0;
    let isFlipped = false;
    let mode = 'all'; // 'all' ou 'errors'
    
    // Estado salvo no LocalStorage
    let stats = JSON.parse(localStorage.getItem('pmpi_stats')) || {
      correct: 0,
      wrong: 0,
      history: {}, // cardId: true/false
      errors: [] // array de cardIds
    };

    let chartInstance = null;

    function init() {
      updateStatsUI();
      filterCards();
      renderChart();
    }

    function toggleMode(newMode) {
      mode = newMode;
      document.getElementById('btn-mode-all').className = mode === 'all' ? "px-3 py-1 text-xs rounded bg-emerald-600 text-white font-semibold" : "px-3 py-1 text-xs rounded bg-slate-700 text-slate-300 font-semibold";
      document.getElementById('btn-mode-errors').className = mode === 'errors' ? "px-3 py-1 text-xs rounded bg-rose-600 text-white font-semibold" : "px-3 py-1 text-xs rounded bg-slate-700 text-slate-300 font-semibold";
      filterCards();
    }

    function filterCards() {
      const subject = document.getElementById('subject-filter').value;
      let list = rawCards;

      if (subject !== 'ALL') {
        list = list.filter(c => c.subject === subject);
      }

      if (mode === 'errors') {
        list = list.filter(c => stats.errors.includes(c.id));
      }

      currentCards = list;
      currentIndex = 0;
      showCard();
    }

    function showCard() {
      isFlipped = false;
      document.getElementById('card-inner').classList.remove('rotate-y-180');

      if (currentCards.length === 0) {
        document.getElementById('card-question').innerText = mode === 'errors' ? "Nenhum card com erro encontrado! Parabéns!" : "Nenhum card disponível nesta categoria.";
        document.getElementById('card-subject').innerText = "-";
        document.getElementById('card-topic').innerText = "-";
        return;
      }

      const card = currentCards[currentIndex];
      document.getElementById('card-subject').innerText = card.subject;
      document.getElementById('card-topic').innerText = card.topic;
      document.getElementById('card-question').innerText = card.question;
      document.getElementById('card-answer').innerText = card.answer;
      document.getElementById('card-gabarito').innerText = card.correctAnswer ? "GABARITO: CERTO" : "GABARITO: ERRADO";
      document.getElementById('card-gabarito').className = card.correctAnswer ? "px-2 py-0.5 rounded text-white bg-emerald-600" : "px-2 py-0.5 rounded text-white bg-rose-600";
    }

    function flipCard() {
      if (currentCards.length === 0) return;
      isFlipped = !isFlipped;
      document.getElementById('card-inner').classList.toggle('rotate-y-180', isFlipped);
    }

    function markCard(userAnsweredCorrectly) {
      if (currentCards.length === 0) return;
      const card = currentCards[currentIndex];

      if (userAnsweredCorrectly) {
        stats.correct++;
        stats.errors = stats.errors.filter(id => id !== card.id);
      } else {
        stats.wrong++;
        if (!stats.errors.includes(card.id)) {
          stats.errors.push(card.id);
        }
      }

      stats.history[card.id] = userAnsweredCorrectly;
      saveStats();
      updateStatsUI();
      renderChart();

      // Próximo Card
      currentIndex = (currentIndex + 1) % currentCards.length;
      showCard();
    }

    function updateStatsUI() {
      document.getElementById('stat-correct').innerText = stats.correct;
      document.getElementById('stat-wrong').innerText = stats.wrong;
      document.getElementById('error-count-badge').innerText = stats.errors.length;

      const totalReviewed = stats.correct + stats.wrong;
      const pct = totalReviewed > 0 ? Math.round((stats.correct / totalReviewed) * 100) : 0;
      document.getElementById('progress-text').innerText = `${totalReviewed} revisões (${pct}% de acerto)`;
      document.getElementById('progress-bar').style.width = `${Math.min(pct, 100)}%`;
    }

    function saveStats() {
      localStorage.setItem('pmpi_stats', JSON.stringify(stats));
    }

    function resetStats() {
      if (confirm("Deseja zerar suas estatísticas de estudo?")) {
        stats = { correct: 0, wrong: 0, history: {}, errors: [] };
        saveStats();
        init();
      }
    }

    function renderChart() {
      const ctx = document.getElementById('performanceChart').getContext('2d');
      
      // Calcular % por matéria
      const subjects = ["Legislação PMPI", "Noções de Direito"];
      const dataPct = subjects.map(sub => {
        const subCards = rawCards.filter(c => c.subject === sub);
        let correctCount = 0;
        let totalCount = 0;
        subCards.forEach(c => {
          if (stats.history[c.id] !== undefined) {
            totalCount++;
            if (stats.history[c.id] === true) correctCount++;
          }
        });
        return totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;
      });

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: subjects,
          datasets: [{
            label: '% de Acerto',
            data: dataPct,
            backgroundColor: ['#10b981', '#3b82f6'],
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { beginAtZero: true, max: 100, ticks: { color: '#94a3b8' } },
            x: { ticks: { color: '#94a3b8' } }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    window.onload = init;
  </script>
</body>
</html>
